name: Fuzz

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    uses: kevmoo/fuzz.dart/.github/workflows/fuzz.yaml@main
    with:
      working-directory: pkgs/mysql_client
      targets: test/fuzz/mysql_packet_fuzz.dart
      max-total-time: ${{ github.event_name == 'schedule' && 300 || 30 }}
